<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    :root{
      --bg:#141414;
      --fg:#f4f4f4;
      --muted:#bdbdbd;
    }
    @media (prefers-color-scheme: light){
      :root{
        --bg:#ffffff;
        --fg:#171717;
        --muted:#555555;
      }
    }

    .body{fill:var(--bg);stroke:var(--fg);stroke-width:6}
    .stroke{fill:none;stroke:var(--fg);stroke-width:4}
    .pad{fill:var(--bg);stroke:var(--fg);stroke-width:4}
    .label{fill:var(--fg);font-family:Arial,Helvetica,sans-serif}
    .title{font-size:26px;font-weight:700;letter-spacing:2px}
    .key{font-size:24px;font-weight:700}
    .map{font-size:15px;fill:var(--muted)}
  </style>

  <!-- Simple Game Boy-like body -->
  <rect class="body" x="45" y="25" width="610" height="380" rx="42"/>

  <!-- Header -->
  <text class="label title" x="350" y="70" text-anchor="middle">KEYBOARD</text>
  <line class="stroke" x1="95" y1="88" x2="605" y2="88"/>

  <!-- D-pad -->
  <path class="pad" d="
    M145 157 h55 v-55 h40 v55 h55
    v40 h-55 v55 h-40 v-55 h-55 z"/>
  <text class="label key" x="220" y="138" text-anchor="middle">W</text>
  <text class="label key" x="173" y="185" text-anchor="middle">A</text>
  <text class="label key" x="268" y="185" text-anchor="middle">D</text>
  <text class="label key" x="220" y="233" text-anchor="middle">S</text>
  <text class="label map" x="220" y="267" text-anchor="middle">MOVE</text>

  <!-- Action buttons -->
  <circle class="pad" cx="445" cy="145" r="37"/>
  <text class="label key" x="445" y="153" text-anchor="middle">A</text>
  <text class="label map" x="445" y="201" text-anchor="middle">J</text>

  <circle class="pad" cx="530" cy="205" r="37"/>
  <text class="label key" x="530" y="213" text-anchor="middle">B</text>
  <text class="label map" x="530" y="261" text-anchor="middle">K</text>

  <!-- Select / Start -->
  <g transform="translate(350,315)">
    <rect class="pad" x="-177" y="-14" width="75" height="28" rx="14"/>
    <rect class="pad" x="102" y="-14" width="75" height="28" rx="14"/>
    <text class="label map" x="-140" y="42" text-anchor="middle">SELECT — SPACE</text>
    <text class="label map" x="140" y="42" text-anchor="middle">START — ENTER</text>
  </g>
</svg>
