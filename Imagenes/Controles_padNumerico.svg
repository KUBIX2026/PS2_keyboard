<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    :root{
      --bg:#141414;
      --fg:#f4f4f4;
      --muted:#bdbdbd;
    }
    @media (prefers-color-scheme: light){
      :root{
        --bg:#ffffff;
        --fg:#171717;
        --muted:#555555;
      }
    }

    .body{fill:var(--bg);stroke:var(--fg);stroke-width:6}
    .stroke{fill:none;stroke:var(--fg);stroke-width:4}
    .label{fill:var(--fg);font-family:Arial,Helvetica,sans-serif}
    .title{font-size:26px;font-weight:700;letter-spacing:2px}

    .cell{fill:var(--bg);stroke:var(--muted);stroke-width:2}
    .cell.active{stroke:var(--fg);stroke-width:3}

    .legend{fill:var(--muted);font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700}
    .legend.active{fill:var(--fg)}
    .func{fill:var(--fg);font-family:Arial,Helvetica,sans-serif;font-size:11px;font-weight:700;letter-spacing:1px}
  </style>

  <!-- Body -->
  <rect class="body" x="45" y="25" width="610" height="380" rx="42"/>

  <!-- Header -->
  <text class="label title" x="350" y="70" text-anchor="middle">NUMPAD</text>
  <line class="stroke" x1="95" y1="88" x2="605" y2="88"/>

  <!-- Row 1 -->
  <rect class="cell" x="195" y="100" width="70" height="50" rx="8"/>
  <text class="legend" x="230" y="131" text-anchor="middle">Esc</text>

  <rect class="cell" x="275" y="100" width="70" height="50" rx="8"/>
  <text class="legend" x="310" y="131" text-anchor="middle">F1</text>

  <rect class="cell active" x="355" y="100" width="70" height="50" rx="8"/>
  <text class="legend active" x="390" y="124" text-anchor="middle">F2</text>
  <text class="func" x="390" y="140" text-anchor="middle">B</text>

  <rect class="cell" x="435" y="100" width="70" height="50" rx="8"/>
  <text class="legend" x="470" y="131" text-anchor="middle">F3</text>

  <!-- Row 2 -->
  <rect class="cell" x="195" y="160" width="70" height="50" rx="8"/>
  <text class="legend" x="230" y="191" text-anchor="middle">7</text>

  <rect class="cell active" x="275" y="160" width="70" height="50" rx="8"/>
  <text class="legend active" x="310" y="184" text-anchor="middle">8</text>
  <text class="func" x="310" y="200" text-anchor="middle">A</text>

  <rect class="cell" x="355" y="160" width="70" height="50" rx="8"/>
  <text class="legend" x="390" y="191" text-anchor="middle">9</text>

  <rect class="cell" x="435" y="160" width="70" height="50" rx="8"/>
  <text class="legend" x="470" y="191" text-anchor="middle">F4</text>

  <!-- Row 3 -->
  <rect class="cell" x="195" y="220" width="70" height="50" rx="8"/>
  <text class="legend" x="230" y="251" text-anchor="middle">4</text>

  <rect class="cell" x="275" y="220" width="70" height="50" rx="8"/>
  <text class="legend" x="310" y="251" text-anchor="middle">5</text>

  <rect class="cell active" x="355" y="220" width="70" height="50" rx="8"/>
  <text class="legend active" x="390" y="244" text-anchor="middle">6</text>
  <text class="func" x="390" y="260" text-anchor="middle">DER</text>

  <rect class="cell" x="435" y="220" width="70" height="50" rx="8"/>
  <text class="legend" x="470" y="251" text-anchor="middle">&#8592;</text>

  <!-- Row 4 -->
  <rect class="cell" x="195" y="280" width="70" height="50" rx="8"/>
  <text class="legend" x="230" y="311" text-anchor="middle">1</text>

  <rect class="cell active" x="275" y="280" width="70" height="50" rx="8"/>
  <text class="legend active" x="310" y="304" text-anchor="middle">2</text>
  <text class="func" x="310" y="320" text-anchor="middle">ARRIBA</text>

  <rect class="cell active" x="355" y="280" width="70" height="50" rx="8"/>
  <text class="legend active" x="390" y="304" text-anchor="middle">3</text>
  <text class="func" x="390" y="320" text-anchor="middle">ABAJO</text>

  <!-- Enter, spans row 4 and 5 -->
  <rect class="cell active" x="435" y="280" width="70" height="110" rx="8"/>
  <text class="legend active" x="470" y="333" text-anchor="middle">Enter</text>
  <text class="func" x="470" y="349" text-anchor="middle">START</text>

  <!-- Row 5 -->
  <!-- 0, spans col 1 and 2 -->
  <rect class="cell active" x="195" y="340" width="150" height="50" rx="8"/>
  <text class="legend active" x="270" y="364" text-anchor="middle">0</text>
  <text class="func" x="270" y="380" text-anchor="middle">SELECT</text>

  <rect class="cell active" x="355" y="340" width="70" height="50" rx="8"/>
  <text class="legend active" x="390" y="364" text-anchor="middle">.</text>
  <text class="func" x="390" y="380" text-anchor="middle">IZQ</text>
</svg>
